
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>マライラジ・コウサリヤ | 職務経歴書</title>

    <style>

        /* Basic page settings */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            color: #333333;
            margin: 0;
            padding: 0;
            line-height: 1.7;
        }

        /* Main heading */
        header {
            background-color: #172b4d;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        header p {
            color: #dce6f2;
        }

        /* Download button */
        .download-container {
            text-align: center;
            margin: 20px;
        }

        .download-btn {
            display: inline-block;
            background-color: #172b4d;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: #547ca8;
        }

        /* Navigation menu */
        nav {
            background-color: #243f65;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        nav a:hover {
            color: #f5c76b;
        }

        /* Main content */
        main {
            width: 85%;
            max-width: 950px;
            margin: 30px auto;
        }

        /* Each section */
        section {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        h2 {
            color: #172b4d;
            border-bottom: 2px solid #d9e2ef;
            padding-bottom: 10px;
        }

        h3 {
            color: #243f65;
        }

        /* Experience details */
        .job {
            border-left: 4px solid #547ca8;
            padding-left: 15px;
            margin-bottom: 25px;
        }

        .date {
            color: #666666;
            font-weight: bold;
        }

        /* Skills */
        .skill {
            display: inline-block;
            background-color: #e8eef6;
            color: #243f65;
            padding: 8px 14px;
            margin: 5px;
            border-radius: 5px;
        }

        /* Footer */
        footer {
            background-color: #172b4d;
            color: white;
            text-align: center;
            padding: 20px;
        }

    </style>
</head>
